name: Deploy to GitHub Pages & Release

on:
  push:
    branches: [ main ]
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  # ЭТАП 1: Тестирование
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Run Tests
        run: bun test

  # ЭТАП 2: Сборка (только для ветки main или manual dispatch)
  build:
    needs: test
    if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Build
        run: bun run build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  # ЭТАП 3: Деплой на GitHub Pages
  deploy:
    needs: build
    if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  # ЭТАП 4: Публикация релиза на GitHub (без бинарников / архивов)
  release:
    needs: test
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract Release Notes from Changelog
        run: |
          node -e "
            const fs = require('fs');
            const tag = '${{ github.ref_name }}'.replace(/^v/, '');
            const content = fs.readFileSync('changelog.md', 'utf8');
            const tagRegex = new RegExp('##\\\\s*\\\[' + tag.replace(/\\./g, '\\\\.') + '\\\\][\\\\s\\\\S]*?(?=(?:\\\\n##\\\\s*\\\[|$))');
            let match = content.match(tagRegex);
            if (!match) {
              match = content.match(new RegExp('##\\\\s*\\\[' + '[\\\\s\\\\S]*?(?=(?:\\\\n##\\\\s*\\\[|$))'));
            }
            if (match) {
              fs.writeFileSync('RELEASE_NOTES.md', match[0].trim());
            } else {
              fs.writeFileSync('RELEASE_NOTES.md', 'Release ' + '${{ github.ref_name }}');
            }
          "

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          body_path: RELEASE_NOTES.md
